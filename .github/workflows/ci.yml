name: CI

on:
  pull_request:
  push:
    branches: [main]

# BR-1: warnings are errors. A tolerated warning stream hides the one that matters.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust — format and lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version (BR-4); the action honours it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy -D warnings
        run: cargo clippy --all-targets --all-features -- -D warnings

  typescript:
    name: TypeScript — typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: tsc --noEmit (TSG-1 flags)
        run: pnpm run check:types

  layering:
    name: Architecture — dependency rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # DR-1…DR-5. Rules cite the identifier they enforce so a failure names the rule.
      - name: dependency-cruiser
        run: pnpm run check:layering
      # DR-6. Fails if it scans zero files (ADR-0003 R-7).
      - name: cfg-usage (DR-6)
        run: pnpm run check:cfg

  lockfiles:
    name: Supply chain — lockfile integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # §18.10: both lockfiles are committed and installs are frozen.
      - name: pnpm --frozen-lockfile
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo --locked
        run: cargo metadata --locked --format-version 1 > /dev/null
