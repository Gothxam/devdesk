[workspace]
resolver = "2"

# `apps/*/src-tauri` is added in commit 5, when the binary crate exists. Cargo treats a
# member glob that matches nothing as a hard error, so a glob cannot be declared before
# its directory exists. See planning/SPRINT_1.md deviations D-1 and D-2.
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
rust-version = "1.97"
license = "SEE LICENSE IN LICENSE"
repository = "https://github.com/devdesk/devdesk"
publish = false

# RL-6a — every third-party version is declared once, here. A member crate declaring
# its own version of a shared dependency is prohibited: divergent versions of serde or
# tokio across crates produce link-time duplication that presents as trait mismatches.
[workspace.dependencies]

# RL-6b — the RS-1 lint set is declared here, not per crate. A crate cannot opt out.
# EM-1 is only meaningful as an absolute (ADR-0001 RA-6).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
await_holding_lock = "deny"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
