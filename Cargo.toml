[workspace]
resolver = "2"

members = ["crates/*", "apps/*/src-tauri"]

[workspace.package]
edition = "2021"
version = "0.1.0"
rust-version = "1.97"
license = "SEE LICENSE IN LICENSE"
repository = "https://github.com/devdesk/devdesk"
publish = false

# RL-6a — every third-party version is declared once, here. A member crate declaring
# its own version of a shared dependency is prohibited: divergent versions of serde or
# tokio across crates produce link-time duplication that presents as trait mismatches.
[workspace.dependencies]
# The cfg-free path to a native window handle. DR-6 prohibits #[cfg(target_os)]
# outside devdesk-platform, and this is how the host reaches an HWND without one:
# a runtime match on an enum that exists on every platform. Already in the tree
# transitively via tauri.
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
# Test-only across the workspace: asserting that what claims to be persistable
# actually round-trips. Already present transitively via tauri.
serde_json = "1"
specta = { version = "2.0.0-rc", features = ["derive"] }
specta-typescript = "0.0.9"
tauri = { version = "2", features = ["isolation", "protocol-asset"] }
tauri-specta = { version = "2.0.0-rc", features = ["derive", "typescript"] }
thiserror = "2"
# SEC-20: the Win32 bindings. Not written in-house — the alternative is
# hand-declared `extern "system"` signatures for GDI, DisplayConfig, HiDpi, and
# the message loop, where one wrong field width is a silent memory error rather
# than a compile failure. Already in the tree transitively via tauri; declaring it
# here adds no new transitive weight. Confined to devdesk-platform by DR-6.
windows = "0.61"

# RL-6b — the RS-1 lint set is declared here, not per crate. A crate cannot opt out.
# EM-1 is only meaningful as an absolute (ADR-0001 RA-6).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
await_holding_lock = "deny"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
