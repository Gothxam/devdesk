[package]
name = "devdesk-core"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
devdesk-display = { path = "../devdesk-display" }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
devdesk-platform = { path = "../devdesk-platform" }
serde_json = { workspace = true }

# ADR-0003 RL-14 puts cross-cutting suites under the repository-root `tests/`.
# Pointing a test target at that path keeps the file where the ADR says it lives
# without adding a crate, which RL-4 would make an ADR amendment.
[[test]]
name = "window_lifecycle"
path = "../../tests/integration/window_lifecycle.rs"

[[test]]
name = "window_races"
path = "../../tests/integration/window_races.rs"

[[test]]
name = "window_recovery"
path = "../../tests/integration/window_recovery.rs"
