[package]
name = "devdesk-core"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
devdesk-display = { path = "../devdesk-display" }
# The z-order band vocabulary (`SurfaceLayer`) is defined here and is portable —
# a plain enum with no `cfg`. Deciding *which* band edit mode uses is desktop
# policy, and policy belongs beside the rest of it rather than in the Tauri shell
# DR-7 keeps thin. Already in the graph via devdesk-display.
devdesk-platform = { path = "../devdesk-platform" }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

# ADR-0003 RL-14 puts cross-cutting suites under the repository-root `tests/`.
# Pointing a test target at that path keeps the file where the ADR says it lives
# without adding a crate, which RL-4 would make an ADR amendment.
[[test]]
name = "window_lifecycle"
path = "../../tests/integration/window_lifecycle.rs"

[[test]]
name = "window_races"
path = "../../tests/integration/window_races.rs"

[[test]]
name = "window_recovery"
path = "../../tests/integration/window_recovery.rs"

[[test]]
name = "window_properties"
path = "../../tests/integration/window_properties.rs"

[[test]]
name = "window_bench"
path = "../../tests/perf/window.bench.rs"
