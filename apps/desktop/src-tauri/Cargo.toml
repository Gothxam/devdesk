[package]
name = "devdesk-app"
description = "DevDesk desktop host — thin composition root (DR-7)"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
default-run = "devdesk-app"

[lib]
name = "devdesk_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
# SEC-6: the isolation pattern is enabled in tauri.conf.json, and Tauri requires
# the feature on both the build and runtime dependency. The allowlist check fails
# the build if they diverge.
tauri-build = { version = "2", features = ["isolation"] }

# The production asset path, and the only thing that selects it.
#
# `tauri-build` derives `cfg(dev)` from the *absence* of this feature, not from
# the cargo profile: `cargo build --release` alone still bakes in `devUrl` and
# ships a binary that shows "localhost refused to connect" on a machine with no
# dev server. A packaged build is `--features custom-protocol`, which is what
# `cargo tauri build` passes for you.
[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
devdesk-core = { path = "../../../crates/devdesk-core" }
devdesk-display = { path = "../../../crates/devdesk-display" }
devdesk-ipc = { path = "../../../crates/devdesk-ipc" }
devdesk-platform = { path = "../../../crates/devdesk-platform" }
# isolation      — SEC-6, the interposed frame between surface and IPC bridge
# protocol-asset — SEC-7, the scope-gated asset protocol for theme and plugin assets
raw-window-handle = { workspace = true }
serde = { workspace = true }
specta-typescript = { workspace = true }
tauri = { workspace = true }

